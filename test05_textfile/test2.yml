# test05_textfile/test.yml
- name:  ansible 파일 조작 실습
  hosts: all
  become: yes

  vars:
    target_file: /tmp/sample_app.conf

  tasks:
    - name: 1. 실습용 텍스트 생성 및 전송
      lineinfile:
        path: "{{ target_file }}"
        regexp: '^debug_mode\s*='
        line: "debug_mode = true"
        state: present